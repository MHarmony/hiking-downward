name: Bug report
description: Report a reproducible problem in HikingDownward
title: '[Bug]: '
labels:
  - 'type: fix'
  - 'status: needs-triage'
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities, do not open a public issue. Use a [private GitHub Security Advisory](https://github.com/MHarmony/hiking-downward/security/advisories/new) instead.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Briefly describe the problem and its impact.
      placeholder: Tell us what went wrong.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest set of steps, code, or a link needed to reproduce the issue.
      placeholder: |
        1. Go to...
        2. Run...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include relevant logs or screenshots with sensitive data removed.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Which release, commit, or branch is affected?
      placeholder: v0.1.0 or abc1234
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, browser, Bun, Node.js, and relevant Nx project details.
      placeholder: |
        OS:
        Browser:
        Bun:
        Node.js:
        Nx project:
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and found no duplicate.
          required: true
        - label: I removed secrets and personal data from this report.
          required: true
        - label: This is not a security vulnerability requiring private disclosure.
          required: true
