<div class="mx-auto max-w-2xl text-center">
  <img
    ngSrc="/images/hiker-mountain.svg"
    width="240"
    height="180"
    priority
    i18n-alt="@@hiking-illustration.alt"
    alt="Stick figure hiking toward a mountain"
    class="mx-auto h-36 w-48" />
  <h1
    i18n="home page headline|Welcome headline on the home page@@home.title"
    class="mt-10 text-4xl font-semibold tracking-tight text-balance text-gray-900 sm:text-5xl dark:text-white">
    Welcome to HikingDownward
  </h1>
  <p class="mt-6 text-lg/8 text-gray-600 dark:text-gray-400" i18n>
    We're getting things ready. Sign in or create an account to get started.
  </p>
  <div class="mt-10 flex items-center justify-center gap-x-6">
    <a
      routerLink="/sign-in"
      i18n
      class="rounded-md bg-indigo-800 px-3.5 py-2.5 text-sm font-semibold text-white shadow-xs hover:bg-indigo-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-800 dark:bg-indigo-700 dark:shadow-none dark:hover:bg-indigo-800 dark:focus-visible:outline-indigo-300">
      Sign in
    </a>
    <a
      routerLink="/sign-up"
      i18n
      class="text-sm/6 font-semibold text-gray-900 hover:text-indigo-800 dark:text-white dark:hover:text-indigo-200">
      Create an account
      <span aria-hidden="true">&rarr;</span>
    </a>
  </div>
</div>
