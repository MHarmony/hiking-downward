<div class="grid place-items-center">
  <div class="text-center">
    <p class="text-base font-semibold text-indigo-700 dark:text-indigo-300">{{ code() }}</p>
    <h1
      class="mt-4 text-5xl font-semibold tracking-tight text-balance text-gray-900 sm:text-7xl dark:text-white">
      {{ heading() }}
    </h1>
    <p class="mt-6 text-lg font-medium text-pretty text-gray-700 sm:text-xl/8 dark:text-gray-300">
      {{ description() }}
    </p>
    <div class="mt-10 flex items-center justify-center gap-x-6">
      <a
        routerLink="/"
        class="rounded-md bg-indigo-700 px-3.5 py-2.5 text-sm font-semibold text-white shadow-xs hover:bg-indigo-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-700 dark:bg-indigo-700 dark:hover:bg-indigo-800 dark:focus-visible:outline-indigo-300">
        Go back home
      </a>
      <a routerLink="/contact" class="text-sm font-semibold text-gray-900 dark:text-white">
        Contact support
        <span aria-hidden="true">&rarr;</span>
      </a>
    </div>
  </div>
</div>
